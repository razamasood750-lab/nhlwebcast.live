<script>
const API = "https://ovogoal.pages.dev/api/v2/flyembed2.json";

// ---- URL params ----
const params = new URLSearchParams(location.search);
let streamUrl = params.get("url");
const matchTitle = params.get("title") || "NHL Live Match";

document.getElementById("matchTitle").textContent = matchTitle;
document.title = matchTitle + " — Live | NHL Streams";

// ---- Helpers ----
function pick(m, keys) {
  for (const k of keys) {
    if (m[k] && String(m[k]).trim() && String(m[k]).trim() !== "-") return String(m[k]).trim();
  }
  return "";
}
const team1Name = m => pick(m, ["Team1","Team1Name","Home","HomeTeam","team1","Home Team","Team1Logo"]) || "Home";
const team2Name = m => pick(m, ["Team2","Team2Name","Away","AwayTeam","team2","Away Team","Team2Logo"]) || "Away";

function isNHL(m) {
  const s = `${m.Sport || ""} ${m.League || ""}`.toLowerCase();
  return s.includes("nhl");
}

// SMART scanner — har field me http URL dhundo (image chhod ke)
function findStream(m) {
  const known = pick(m, ["IframeUrl","iframeUrl","iframeurl","Iframe","iframe","Url","url","URL","StreamUrl","streamUrl","streamurl","EmbedUrl","embedUrl","embedurl","Embed","embed","Link","link","Stream","stream","WatchUrl","watchUrl","VideoUrl","videoUrl","videourl","PlayerUrl","playerUrl","Source","source","ChannelUrl","channelUrl"]);
  if (known && /^https?:\/\//i.test(known)) return known;
  let fallback = "";
  for (const k in m) {
    const v = String(m[k] || "").trim();
    if (/^https?:\/\//i.test(v) && !/\.(png|jpe?g|gif|svg|webp|ico|css|js)(\?|$)/i.test(v)) {
      if (/embed|iframe|player|stream|watch|cast/i.test(v)) return v;
      if (!fallback) fallback = v;
    }
  }
  return fallback;
}

// ---- Fallback: khud API fetch karke title se match dhundo ----
async function selfFindStream() {
  try {
    const r = await fetch(API);
    const data = await r.json();
    const matches = (Array.isArray(data) ? data : []).filter(isNHL);
    const q = matchTitle.toLowerCase().trim();
    const m = matches.find(x => (team1Name(x) + " vs " + team2Name(x)).toLowerCase().trim() === q)
           || matches.find(x => q.includes(team1Name(x).toLowerCase().trim()) && q.includes(team2Name(x).toLowerCase().trim()));
    if (m) return findStream(m);
  } catch (e) {}
  return "";
}

function playStream(url) {
  streamUrl = url;
  document.getElementById("player").src = url;
}

function showNoStream() {
  document.getElementById("playerBox").outerHTML = `
    <div class="no-stream">
      <span class="puck">🏒</span>
      <h2>${matchTitle}</h2>
      <p>Stream for this match is not available yet — check back soon!</p>
      <p><a href="index.html">← Back to Matches</a></p>
    </div>`;
}

// ---- Refresh Stream button ----
function refreshStream() {
  if (streamUrl) {
    const p = document.getElementById("player");
    p.src = "";            // pehle clear karo
    setTimeout(() => { p.src = streamUrl; }, 100);  // phir dobara chalao
  } else {
    location.reload();     // stream nahi mila tha to poora page reload
  }
}

// ---- Main ----
(async function init() {
  if (streamUrl) {
    playStream(streamUrl);          // URL param mila → seedha chalao
  } else {
    const found = await selfFindStream();
    if (found) playStream(found);
    else showNoStream();
  }
})();
</script>
